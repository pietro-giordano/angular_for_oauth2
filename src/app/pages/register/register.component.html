<div class="flex justify-center">
    <form [formGroup]="registerForm" (onSubmit)="onSubmit()"
        class="p-12 w-full md:w-1/2 xl:w-1/3 flex flex-col gap-y-4">
        <div>
            <label class="input input-bordered flex items-center gap-2"
                [class.input-error]="email.invalid && (email.dirty || email.touched)"
                [class.input-success]="email.valid">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    class="h-4 w-4 opacity-70">
                    <path
                        d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z" />
                    <path
                        d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z" />
                </svg>
                <input formControlName="email" type="text" class="grow" placeholder="Email" />
            </label>

            <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-error">
                <div *ngIf="email.hasError('required')">
                    Email is required.
                </div>
                <div *ngIf="email.hasError('email')">
                    Invalid pattern for email.
                </div>
            </div>
        </div>

        <div>
            <label class="input input-bordered flex items-center gap-2"
                [class.input-error]="username.invalid && (username.dirty || username.touched)"
                [class.input-success]="username.valid">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    class="h-4 w-4 opacity-70">
                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z" />
                </svg>
                <input formControlName="username" type="text" class="grow" placeholder="Username" />
            </label>

            <div *ngIf="username.invalid && (username.dirty || username.touched)" class="text-error">
                <div *ngIf="username.hasError('required')">
                    Username is required.
                </div>
                <div *ngIf="username.hasError('minlength')">
                    Username min length 6 characters.
                </div>
                <div *ngIf="username.hasError('maxlength')">
                    Username max length 32 characters.
                </div>
            </div>
        </div>

        <div>
            <label class="input input-bordered flex items-center gap-2"
                [class.input-error]="password.invalid && (password.dirty || password.touched)"
                [class.input-success]="password.valid">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    class="h-4 w-4 opacity-70">
                    <path fill-rule="evenodd"
                        d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z"
                        clip-rule="evenodd" />
                </svg>
                <input formControlName="password" type="password" class="grow" placeholder="Password" />
            </label>

            <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-error">
                <div *ngIf="password.hasError('required')">
                    Password is required.
                </div>
                <div *ngIf="password.hasError('minlength')">
                    Password min length 8 characters.
                </div>
            </div>
        </div>

        <button [disabled]="!registerForm.valid" type="submit" class="btn btn-outline">Register</button>
    </form>
</div>
